#NEED TO USE the more granular from the biophysical yaml - export the original yaml with changed values

bounds:
  # --- Na / K (soma) ---
  soma.gbar_nas:   [0.01, 0.08]      # YAML: 0.04
  soma.gkdrbar:    [0.01, 0.10]      # YAML: 0.0478
  soma.gkabar:     [0.01, 0.08]      # YAML: 0.0305
  soma.sh_nas/x:   [0.0, 10.0]       # YAML: 1.7
  soma.sha_nas/x:  [-10.0, 0.0]      # YAML: 0.0
  # --- Soma Ca (single-zone) ---
  soma.cal.gcalbar: [0.001, 0.02]    # YAML: 0.007
  soma.car.gcabar:  [0.0005, 0.01]   # YAML: 0.003
  soma.cat.gcatbar: [1.0e-5, 5.0e-4] # YAML: 5e-5
  # --- calH (L-type, trunk/apical/tuft — two zones) ---
  trunk.calH.gcalbar_prox: [1.0e-5, 2.0e-4]   # YAML: 3.1635e-05 (max_loc=50)
  apical.Ca.gcalHbar:      [5.0e-4, 0.01]      # YAML: 0.001455   (min_loc=50)
  tuft.Ca.gcalHbar:        [5.0e-4, 0.01]      # YAML: 0.001455   (min_loc=50)
  # --- car (R-type, trunk/apical/tuft inherit) ---
  apical.Ca.gcabar: [1.0e-5, 2.0e-4]   # YAML trunk: 3e-5
  # --- cat (T-type, distal zone >350um; slope derived from endpoint) ---
  apical.Ca.gcatbar: [1.0e-4, 1.0e-3]  # YAML: 0.0004
  tuft.Ca.gcatbar:   [1.0e-4, 1.0e-3]  # YAML: 0.0004
  # --- CadepK (soma single zone) ---
  soma.CadepK.gbkbar: [0.01, 0.5]      # YAML: 0.09075
  soma.CadepK.gskbar: [1.0e-4, 5.0e-3] # YAML: 0.0005
  # --- CadepK (trunk — three zones) ---
  trunk.CadepK.gbkbar_prox: [0.001, 0.05]   # YAML: 0.004125 (max_loc=50)
  trunk.CadepK.gbkbar_mid:  [0.005, 0.15]   # YAML: 0.033    (50-200)
  trunk.CadepK.gbkbar_dist: [0.001, 0.05]   # YAML: 0.004125 (>200)
  trunk.CadepK.gskbar_prox: [1.0e-5, 5.0e-4] # YAML: 5e-5   (max_loc=50)
  trunk.CadepK.gskbar_mid:  [1.0e-4, 5.0e-3] # YAML: 0.0005  (50-200)
  trunk.CadepK.gskbar_dist: [1.0e-5, 5.0e-4] # YAML: 5e-5   (>200)
  # --- CadepK (tuft — flat) ---
  tuft.CadepK.gbkbar: [0.001, 0.1]     # YAML: 0.01815
  tuft.CadepK.gskbar: [1.0e-4, 5.0e-3] # YAML: 0.0005
  # --- Cacum ---
  soma.tau_Cacum_2018: [10.0, 200.0]   # YAML: 100
  # --- Synapse counts ---
  num_exc_syns_CA3:   [50, 200]
  num_exc_syns_ECIII: [80, 300]
  num_inh_syns_CA3:   [50, 250]
  num_inh_syns_ECIII: [50, 250]

default_params:
  # --- Na / K ---
  soma.gbar_nas:  0.04
  soma.gkdrbar:   0.0478
  soma.gkabar:    0.0305
  soma.sh_nas/x:  1.7
  soma.sha_nas/x: 0.0
  # --- Soma Ca ---
  soma.cal.gcalbar: 0.007
  soma.car.gcabar:  0.003
  soma.cat.gcatbar: 5.0e-5
  # --- calH ---
  trunk.calH.gcalbar_prox: 3.1635e-05
  apical.Ca.gcalHbar:      0.001455
  tuft.Ca.gcalHbar:        0.001455
  # --- car ---
  apical.Ca.gcabar: 3.0e-5
  # --- cat distal zone ---
  apical.Ca.gcatbar: 0.0004
  tuft.Ca.gcatbar:   0.0004
  # --- CadepK soma ---
  soma.CadepK.gbkbar: 0.09075
  soma.CadepK.gskbar: 0.0005
  # --- CadepK trunk ---
  trunk.CadepK.gbkbar_prox: 0.004125
  trunk.CadepK.gbkbar_mid:  0.033
  trunk.CadepK.gbkbar_dist: 0.004125
  trunk.CadepK.gskbar_prox: 5.0e-5
  trunk.CadepK.gskbar_mid:  0.0005
  trunk.CadepK.gskbar_dist: 5.0e-5
  # --- CadepK tuft ---
  tuft.CadepK.gbkbar: 0.01815
  tuft.CadepK.gskbar: 0.0005
  # --- Cacum ---
  soma.tau_Cacum_2018: 100.0
  # --- Synapses ---
  num_exc_syns_CA3:   100
  num_exc_syns_ECIII: 160
  num_inh_syns_CA3:   120
  num_inh_syns_ECIII: 120


