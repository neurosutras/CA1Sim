update_context:
  - source: Nested_optimize_CA1_tbs_e_I_spiking
    function: get_picklable_context

stages:
  - source: Nested_optimize_CA1_tbs_e_I_spiking
    compute_features: compute_features_rin
    get_objectives: get_objectives_input_resistance
  - source: Nested_optimize_CA1_tbs_e_I_spiking
    compute_features: compute_features_rheobase
    get_objectives: get_objectives_rheobase
  - source: Nested_optimize_CA1_tbs_e_I_spiking
    get_args_dynamic: get_args_dynamic_fi
    compute_features: compute_features_fi_step
    filter_features: filter_features_fi_rates
    get_objectives: get_objectives_fi
  - source: Nested_optimize_CA1_tbs_e_I_spiking
    compute_features: compute_features_unitary_serial
    get_objectives: get_objectives_unitary
  - source: Nested_optimize_CA1_tbs_e_I_spiking
    get_args_static: get_args_static_tbs
    compute_features: compute_features_tbs
    filter_features: filter_features_tbs
    get_objectives: get_objectives_tbs

